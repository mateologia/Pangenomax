<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pangenomax - Jogo de Genômica</title>
  <style>
    :root {
      --bg-dark: #0d1117;
      --card-bg: rgba(22, 27, 34, 0.93);
      --accent: #58a6ff;
      --accent-hover: #1f6feb;
      --accent-purple: #bc8cff;
      --accent-purple-hover: #8957e5;
      --accent-orange: #f0883e;
      --accent-orange-hover: #d25f17;
      --success: #2ea043;
      --error: #f85149;
      --warning: #d29922;
      --text: #c9d1d9;
      --text-bright: #ffffff;
      --border: #30363d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Oxygen, Ubuntu, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 92%;
      max-width: 880px;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.75);
      margin: 24px 0;
      max-height: 90vh;
      overflow-y: auto;
    }

    /* Custom Scrollbar */
    .container::-webkit-scrollbar {
      width: 8px;
    }
    .container::-webkit-scrollbar-track {
      background: #161b22;
    }
    .container::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    .container::-webkit-scrollbar-thumb:hover {
      background: #58a6ff;
    }

    h1.brand-title {
      font-size: 2.8rem;
      text-align: center;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 6px;
      text-shadow: 0 0 16px rgba(88, 166, 255, 0.4);
    }

    p.subtitle {
      text-align: center;
      font-size: 1rem;
      margin-bottom: 28px;
      color: #8b949e;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .menu-options {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .btn {
      background-color: var(--accent);
      color: #fff;
      border: none;
      padding: 15px 28px;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .btn:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 4px 14px rgba(31, 111, 235, 0.4);
    }

    .btn-secondary {
      background-color: #21262d;
      border: 1px solid var(--border);
      color: var(--text-bright);
    }

    .btn-secondary:hover {
      background-color: #30363d;
      border-color: var(--accent);
      box-shadow: none;
    }

    .btn-mode-2 {
      background-color: var(--accent-purple);
    }

    .btn-mode-2:hover {
      background-color: var(--accent-purple-hover);
      box-shadow: 0 4px 14px rgba(188, 140, 255, 0.4);
    }

    .btn-mode-3 {
      background-color: var(--accent-orange);
    }

    .btn-mode-3:hover {
      background-color: var(--accent-orange-hover);
      box-shadow: 0 4px 14px rgba(240, 136, 62, 0.4);
    }

    /* HUD e Timer */
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
      font-weight: 600;
      flex-wrap: wrap;
      gap: 8px;
    }

    .hud-badge {
      background-color: #21262d;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .hud-badge.timer-badge {
      color: var(--text-bright);
      min-width: 90px;
      text-align: center;
      transition: all 0.3s;
    }

    .hud-badge.timer-urgent {
      background-color: rgba(248, 81, 73, 0.2);
      border-color: var(--error);
      color: var(--error);
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }

    .timer-bar-container {
      width: 100%;
      height: 6px;
      background: #21262d;
      border-radius: 4px;
      margin-bottom: 18px;
      overflow: hidden;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background: var(--accent);
      transition: width 1s linear, background-color 0.3s;
    }

    .question-title {
      font-size: 1.15rem;
      color: var(--text-bright);
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .visual-container {
      width: 100%;
      background: #161b22;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .visual-container svg {
      max-width: 100%;
      height: auto;
    }

    .visual-caption {
      font-size: 0.8rem;
      color: #8b949e;
      margin-top: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .opt-btn {
      background: #21262d;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 14px 18px;
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      line-height: 1.4;
    }

    .opt-btn:hover:not(:disabled) {
      border-color: var(--accent);
      background: #30363d;
      color: var(--text-bright);
    }

    .opt-btn.correct {
      background-color: var(--success) !important;
      color: #fff !important;
      border-color: var(--success) !important;
    }

    .opt-btn.wrong {
      background-color: var(--error) !important;
      color: #fff !important;
      border-color: var(--error) !important;
    }

    .feedback-box {
      margin-top: 14px;
      padding: 16px;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.45;
      display: none;
    }

    .feedback-box.correct {
      display: block;
      background-color: rgba(46, 160, 67, 0.15);
      border: 1px solid var(--success);
      color: #7ee787;
    }

    .feedback-box.wrong {
      display: block;
      background-color: rgba(248, 81, 73, 0.15);
      border: 1px solid var(--error);
      color: #ff7b72;
    }

    .btn-next {
      display: none;
      margin-top: 18px;
      margin-left: auto;
    }

    /* Resultados e Relatório de Erros */
    .results-content {
      text-align: center;
      padding: 10px 0;
    }

    .score-circle {
      font-size: 3.2rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .score-subtitle {
      font-size: 1.1rem;
      color: var(--text-bright);
      margin-bottom: 16px;
    }

    .review-container {
      margin-top: 28px;
      text-align: left;
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }

    .review-title {
      font-size: 1.25rem;
      color: var(--text-bright);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .review-item {
      background: #161b22;
      border: 1px solid var(--border);
      border-left: 4px solid var(--error);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .review-q {
      font-weight: 600;
      color: var(--text-bright);
      margin-bottom: 10px;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .review-ans {
      font-size: 0.9rem;
      margin-bottom: 6px;
      line-height: 1.35;
    }

    .review-ans.user {
      color: #ff7b72;
    }

    .review-ans.correct {
      color: #7ee787;
    }

    .review-exp {
      font-size: 0.85rem;
      color: #8b949e;
      background: rgba(48, 54, 61, 0.4);
      padding: 8px 12px;
      border-radius: 6px;
      margin-top: 8px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <canvas id="bgCanvas"></canvas>

  <main class="container">
    <!-- MENU PRINCIPAL -->
    <section id="screen-menu" class="screen active">
      <h1 class="brand-title">Pangenomax</h1>
      <p class="subtitle">Plataforma Interativa de Fixação em Genômica e Bioinformática</p>
      <div class="menu-options">
        <button class="btn" onclick="startQuiz('intro')">1. Introdução à Genômica</button>
        <button class="btn btn-mode-2" onclick="startQuiz('estrutura')">2. Estrutura e Organização de Genomas</button>
        <button class="btn btn-mode-3" onclick="startQuiz('ferramentas')">3. Ferramentas de Obtenção e Avaliação de Genomas</button>
      </div>
    </section>

    <!-- TELA DE QUIZ -->
    <section id="screen-quiz" class="screen">
      <div class="hud">
        <span class="hud-badge" id="hud-mode">Modo</span>
        <span class="hud-badge" id="hud-progress">Questão: 1/10</span>
        <span class="hud-badge timer-badge" id="hud-timer">⏱ 60s</span>
        <span class="hud-badge" id="hud-score">Pontos: 0</span>
      </div>

      <div class="timer-bar-container">
        <div class="timer-bar" id="timer-bar"></div>
      </div>

      <div id="visual-wrapper" class="visual-container" style="display: none;">
        <div id="visual-graphic"></div>
        <span class="visual-caption" id="visual-caption"></span>
      </div>

      <h2 class="question-title" id="question-text">Pergunta...</h2>
      <div class="options-grid" id="options-container"></div>
      <div class="feedback-box" id="feedback"></div>
      <button class="btn btn-next" id="btn-next" onclick="nextQuestion()">Próxima Questão →</button>
    </section>

    <!-- RESULTADOS COM PAINEL DE ERROS -->
    <section id="screen-results" class="screen">
      <div class="results-content">
        <h2 style="color: var(--text-bright); margin-bottom: 8px;">Desafio Concluído!</h2>
        <div class="score-circle" id="final-score">0 pts</div>
        <div class="score-subtitle" id="final-correctness">0 / 0 acertos</div>
        <p id="final-message" style="margin-bottom: 24px; color: #8b949e; line-height: 1.5;"></p>

        <!-- Container dinâmico com a lista de erros -->
        <div id="review-area" class="review-container" style="display: none;">
          <h3 class="review-title">⚠️ Questões para Revisão Conceitual</h3>
          <div id="review-list"></div>
        </div>

        <button class="btn btn-secondary" style="margin: 24px auto 0;" onclick="returnToMenu()">Voltar ao Menu Principal</button>
      </div>
    </section>
  </main>

  <script>

       1. ILUSTRAÇÕES VETORIAIS (SVGs)
       ========================================================================== */

    function startQuiz(modeKey) {
      if (modeKey === 'intro') {
        currentQuestions = [...questionDatabase.intro];
        currentModeTitle = 'Introdução à Genômica';
      } else if (modeKey === 'estrutura') {
        currentQuestions = [...questionDatabase.estrutura];

      currentQuestionIndex = 0;
      score = 0;
      correctCount = 0;
      wrongQuestions = [];
      document.getElementById('hud-mode').innerText = currentModeTitle;

      showScreen('screen-quiz');
      loadQuestion();

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = QUESTION_TIME_LIMIT;
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          handleTimeOut();
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
    }

    function updateTimerDisplay() {
      const timerBadge = document.getElementById('hud-timer');
      const timerBar = document.getElementById('timer-bar');

      timerBadge.innerText = `⏱ ${timeLeft}s`;
      const percentage = (timeLeft / QUESTION_TIME_LIMIT) * 100;
      timerBar.style.width = `${percentage}%`;

      if (timeLeft <= 10) {
        timerBadge.classList.add('timer-urgent');
        timerBar.style.backgroundColor = 'var(--error)';
      } else if (timeLeft <= 25) {
        timerBadge.classList.remove('timer-urgent');
        timerBar.style.backgroundColor = 'var(--warning)';
      } else {
        timerBadge.classList.remove('timer-urgent');
        timerBar.style.backgroundColor = 'var(--accent)';
      }
    }

    function handleTimeOut() {
      const qData = currentQuestions[currentQuestionIndex];
      const buttons = document.querySelectorAll('.opt-btn');
      const feedback = document.getElementById('feedback');

      buttons.forEach(btn => btn.disabled = true);
      buttons[qData.answer].classList.add('correct');

      // Registra como erro por tempo esgotado
      wrongQuestions.push({
        question: qData.q,
        userAnswer: "Tempo Esgotado (Nenhuma alternativa selecionada)",
        correctAnswer: qData.options[qData.answer],
        explanation: qData.explanation
      });

      feedback.className = 'feedback-box wrong';
      feedback.innerHTML = `<strong>Tempo Esgotado! ⏱</strong> A resposta correta era: "${qData.options[qData.answer]}". ${qData.explanation}`;

      document.getElementById('btn-next').style.display = 'block';
    }

        visualWrapper.style.display = 'flex';
      } else {
        visualWrapper.style.display = 'none';
        visualGraphic.innerHTML = '';
      }

      const optContainer = document.getElementById('options-container');
      optContainer.innerHTML = '';

      const feedback = document.getElementById('feedback');
      feedback.className = 'feedback-box';
      feedback.style.display = 'none';

      document.getElementById('btn-next').style.display = 'none';

      qData.options.forEach((optText, idx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = optText;
        btn.onclick = () => selectOption(idx);
        optContainer.appendChild(btn);
      });

      startTimer();
    }

    function selectOption(selectedIdx) {
      stopTimer();
      const qData = currentQuestions[currentQuestionIndex];
      const buttons = document.querySelectorAll('.opt-btn');
      const feedback = document.getElementById('feedback');

      buttons.forEach(btn => btn.disabled = true);

      if (selectedIdx === qData.answer) {
        const speedBonus = timeLeft * 2;
        const roundScore = 100 + speedBonus;
        score += roundScore;
        correctCount++;

        buttons[selectedIdx].classList.add('correct');
        feedback.className = 'feedback-box correct';
        feedback.innerHTML = `<strong>Correto! (+${roundScore} pts)</strong> [Base: 100 + Velocidade: ${speedBonus} pts em ${QUESTION_TIME_LIMIT - timeLeft}s]. ${qData.explanation}`;
      } else {
        // Registra o erro para revisão posterior
        wrongQuestions.push({
          question: qData.q,
          userAnswer: qData.options[selectedIdx],
          correctAnswer: qData.options[qData.answer],
          explanation: qData.explanation
        });

        buttons[selectedIdx].classList.add('wrong');
        buttons[qData.answer].classList.add('correct');
        feedback.className = 'feedback-box wrong';
        feedback.innerHTML = `<strong>Incorreto! (0 pts)</strong> ${qData.explanation}`;
      }

      document.getElementById('hud-score').innerText = `Pontos: ${score}`;
      document.getElementById('btn-next').style.display = 'block';
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < currentQuestions.length) {
        loadQuestion();
      } else {
        finishGame();
      }
    }

    function finishGame() {
      stopTimer();
      showScreen('screen-results');
      document.getElementById('final-score').innerText = `${score} pts`;
      document.getElementById('final-correctness').innerText = `${correctCount} / ${currentQuestions.length} questões corretas`;

      const ratio = correctCount / currentQuestions.length;
      let msg = '';
      if (ratio === 1) {
        msg = "Desempenho Genômico Perfeito! Você acertou todas as questões deste módulo com excelente velocidade!";
      } else if (ratio >= 0.7) {
        msg = "Excelente aproveitamento! Seu domínio dos conceitos moleculares e analíticos está muito bem consolidado.";
      } else if (ratio >= 0.5) {
        msg = "Bom desempenho! Confira os pontos de revisão abaixo para reforçar os tópicos onde houve dúvida.";
      } else {
        msg = "Revise as justificativas conceituais abaixo para fixar os conteúdos e tente uma nova rodada!";
      }
      document.getElementById('final-message').innerText = msg;

      // Renderização da lista de revisão de erros
      const reviewArea = document.getElementById('review-area');
      const reviewList = document.getElementById('review-list');
      reviewList.innerHTML = '';

      if (wrongQuestions.length > 0) {
        reviewArea.style.display = 'block';
        wrongQuestions.forEach((item, index) => {
          const itemDiv = document.createElement('div');
          itemDiv.className = 'review-item';
          itemDiv.innerHTML = `
            <div class="review-q">${index + 1}. ${item.question}</div>
            <div class="review-ans user"><strong>Sua resposta:</strong> ${item.userAnswer}</div>
            <div class="review-ans correct"><strong>Resposta correta:</strong> ${item.correctAnswer}</div>
            <div class="review-exp"><strong>Justificativa:</strong> ${item.explanation}</div>
          `;
          reviewList.appendChild(itemDiv);
        });
      } else {
        reviewArea.style.display = 'none';
      }
    }

    function returnToMenu() {
      stopTimer();
      showScreen('screen-menu');
    }

    /* ==========================================================================
       4. BACKGROUND CANVAS (DINÂMICA DE BASES NITROGENADAS)
       ========================================================================== */
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');

    let particles = [];
    let width = 0;
    let height = 0;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    class Particle {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.vx = (Math.random() - 0.5) * 0.7;
        this.vy = (Math.random() - 0.5) * 0.7;
        this.base = ['A', 'T', 'C', 'G'][Math.floor(Math.random() * 4)];
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0) this.x = width;
        if (this.x > width) this.x = 0;
        if (this.y < 0) this.y = height;
        if (this.y > height) this.y = 0;
      }

      draw() {
        ctx.fillStyle = 'rgba(88, 166, 255, 0.45)';
        ctx.font = '10px monospace';
        ctx.fillText(this.base, this.x, this.y);
      }
    }

    for (let i = 0; i < 60; i++) {
      particles.push(new Particle());
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 100) {
            ctx.strokeStyle = `rgba(88, 166, 255, ${0.12 * (1 - dist / 100)})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
